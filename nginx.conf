server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Legacy startup-era URLs still in Google's index: real 301s here beat the
    # noindexed meta-refresh stubs Astro generates, and exact-match locations
    # win over the regex below so both slash forms redirect in a single hop.
    location = /ai-integration  { return 301 /experiments/; }
    location = /ai-integration/ { return 301 /experiments/; }
    location = /readiness       { return 301 /mapping/; }
    location = /readiness/      { return 301 /mapping/; }
    location = /audits          { return 301 /mapping/; }
    location = /audits/         { return 301 /mapping/; }

    # Directory-based pages must have exactly one URL form: 301 extensionless
    # paths to the trailing-slash version the sitemap and canonicals declare,
    # so Google never sees the same page at two addresses.
    location ~ "^([^.]*[^/.])$" {
        return 301 $1/$is_args$args;
    }

    # Astro builds directory-based URLs (e.g. /about/index.html)
    location / {
        try_files $uri $uri/index.html $uri.html =404;
    }

    # Cache static assets aggressively
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1000;
}
